{
  "openapi": "3.0.3",
  "info": {
    "title": "Family Memories",
    "version": "1.0.0",
    "description": "Plain text preserved verbatim. Length limits measured in UTF-16 code units by API. Non-pronoun strings must contain non-whitespace. No pagination. No public submissions."
  },
  "servers": [
    {
      "url": "https://api.markhazleton.com"
    }
  ],
  "paths": {
    "/api/public/family-memories": {
      "get": {
        "operationId": "GetPublishedFamilyMemories",
        "security": [],
        "description": "All published memories, sortOrder then id ascending. Accept: application/json. CORS: https://texecon.com and explicitly configured development origins; no credentials. Cache-Control: no-store.",
        "responses": {
          "200": {
            "description": "Entire published collection, including empty collection",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/PublishedMemories"
                }
              }
            }
          },
          "500": {
            "description": "Unexpected failure"
          }
        }
      }
    },
    "/api/admin/makeboldspark/family-memories": {
      "get": {
        "operationId": "ListFamilyMemories",
        "security": [
          {
            "Bearer": []
          }
        ],
        "responses": {
          "200": {
            "description": "All draft/published management records in editorial order",
            "content": {
              "application/json": {
                "schema": {
                  "type": "array",
                  "items": {
                    "$ref": "#/components/schemas/MemoryAdmin"
                  }
                }
              }
            }
          },
          "401": {
            "description": "Unauthenticated"
          },
          "403": {
            "description": "Admin role required"
          },
          "500": {
            "description": "Unexpected failure"
          }
        }
      },
      "post": {
        "operationId": "CreateFamilyMemory",
        "security": [
          {
            "Bearer": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/MemoryWrite"
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Created",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/MemoryAdmin"
                }
              }
            },
            "headers": {
              "Location": {
                "schema": {
                  "type": "string"
                },
                "description": "Management resource URL"
              }
            }
          },
          "400": {
            "description": "Invalid input"
          },
          "401": {
            "description": "Unauthenticated"
          },
          "403": {
            "description": "Admin role required"
          },
          "500": {
            "description": "Unexpected failure"
          }
        }
      }
    },
    "/api/admin/makeboldspark/family-memories/{id}": {
      "parameters": [
        {
          "name": "id",
          "in": "path",
          "required": true,
          "schema": {
            "type": "integer"
          }
        }
      ],
      "get": {
        "operationId": "GetFamilyMemory",
        "security": [
          {
            "Bearer": []
          }
        ],
        "responses": {
          "200": {
            "description": "Management record",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/MemoryAdmin"
                }
              }
            }
          },
          "401": {
            "description": "Unauthenticated"
          },
          "403": {
            "description": "Admin role required"
          },
          "404": {
            "description": "Not found"
          },
          "500": {
            "description": "Unexpected failure"
          }
        }
      },
      "put": {
        "operationId": "UpdateFamilyMemory",
        "description": "Full replacement of editable fields. Publish/unpublish with isPublished; reorder with sortOrder. Server owns ID/timestamps. Last committed edit wins.",
        "security": [
          {
            "Bearer": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/MemoryWrite"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Updated",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/MemoryAdmin"
                }
              }
            }
          },
          "400": {
            "description": "Invalid input"
          },
          "401": {
            "description": "Unauthenticated"
          },
          "403": {
            "description": "Admin role required"
          },
          "404": {
            "description": "Not found"
          },
          "500": {
            "description": "Unexpected failure"
          }
        }
      },
      "delete": {
        "operationId": "DeleteFamilyMemory",
        "security": [
          {
            "Bearer": []
          }
        ],
        "responses": {
          "204": {
            "description": "Deleted"
          },
          "401": {
            "description": "Unauthenticated"
          },
          "403": {
            "description": "Admin role required"
          },
          "404": {
            "description": "Not found"
          },
          "500": {
            "description": "Unexpected failure"
          }
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "Bearer": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "JWT"
      }
    },
    "schemas": {
      "Memory": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "personName",
          "personPronouns",
          "relationshipToJared",
          "body"
        ],
        "properties": {
          "personName": {
            "type": "string",
            "maxLength": 200,
            "minLength": 1
          },
          "personPronouns": {
            "type": "string",
            "maxLength": 100
          },
          "relationshipToJared": {
            "type": "string",
            "maxLength": 300,
            "minLength": 1
          },
          "body": {
            "type": "string",
            "maxLength": 100000,
            "minLength": 1
          }
        }
      },
      "MemoryWrite": {
        "type": "object",
        "additionalProperties": true,
        "required": [
          "personName",
          "personPronouns",
          "relationshipToJared",
          "body"
        ],
        "properties": {
          "personName": {
            "type": "string",
            "maxLength": 200,
            "minLength": 1
          },
          "personPronouns": {
            "type": "string",
            "maxLength": 100
          },
          "relationshipToJared": {
            "type": "string",
            "maxLength": 300,
            "minLength": 1
          },
          "body": {
            "type": "string",
            "maxLength": 100000,
            "minLength": 1
          },
          "isPublished": {
            "type": "boolean",
            "default": false
          },
          "sortOrder": {
            "type": "integer",
            "minimum": 0,
            "maximum": 2147483647,
            "default": 0
          }
        }
      },
      "MemoryAdmin": {
        "allOf": [
          {
            "$ref": "#/components/schemas/MemoryWrite"
          },
          {
            "type": "object",
            "required": [
              "id",
              "createdDate",
              "updatedDate"
            ],
            "properties": {
              "id": {
                "type": "integer"
              },
              "createdDate": {
                "type": "string",
                "format": "date-time"
              },
              "updatedDate": {
                "type": "string",
                "format": "date-time"
              }
            }
          }
        ]
      },
      "PublishedMemories": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "success",
          "data"
        ],
        "properties": {
          "success": {
            "type": "boolean",
            "enum": [
              true
            ]
          },
          "data": {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "memories"
            ],
            "properties": {
              "memories": {
                "type": "array",
                "items": {
                  "$ref": "#/components/schemas/Memory"
                }
              }
            }
          }
        }
      }
    }
  }
}
