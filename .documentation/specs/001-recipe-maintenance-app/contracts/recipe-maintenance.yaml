openapi: 3.0.3
info:
  title: MakeBoldSpark Recipe Maintenance API
  version: 1.0.0
  description: Publisher-only, domain-scoped contracts used by MakeBoldSpark.Recipe.Client.
paths:
  /api/publish/recipes/domains:
    get:
      operationId: ListPublisherRecipeDomains
      summary: List configured domains available for recipe maintenance
      security: [{ publisherAuth: [] }]
      responses:
        '200': { description: Domains available to the authenticated publisher, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/MaintenanceDomain' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/publish/recipes:
    get:
      operationId: ListPublisherRecipes
      summary: List recipes available for maintenance in one domain
      security: [{ publisherAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/domainId'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200': { description: Paged recipe inventory including approved and unapproved records, content: { application/json: { schema: { $ref: '#/components/schemas/PagedRecipes' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: CreatePublisherRecipe
      summary: Create a recipe in the active domain
      security: [{ publisherAuth: [] }]
      parameters: [ { $ref: '#/components/parameters/domainId' } ]
      requestBody: { required: true, description: Maximum request body size is 262144 bytes., content: { application/json: { schema: { $ref: '#/components/schemas/RecipeWrite' } } } }
      responses:
        '201': { description: Created recipe, content: { application/json: { schema: { $ref: '#/components/schemas/Recipe' } } } }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/publish/recipes/{id}:
    get:
      operationId: GetPublisherRecipe
      summary: Get a recipe in the active domain
      security: [{ publisherAuth: [] }]
      parameters: [ { $ref: '#/components/parameters/id' }, { $ref: '#/components/parameters/domainId' } ]
      responses:
        '200': { description: Recipe, content: { application/json: { schema: { $ref: '#/components/schemas/Recipe' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: UpdatePublisherRecipe
      summary: Update a recipe when its version matches
      security: [{ publisherAuth: [] }]
      parameters: [ { $ref: '#/components/parameters/id' }, { $ref: '#/components/parameters/domainId' }, { $ref: '#/components/parameters/ifMatch' } ]
      requestBody: { required: true, description: Maximum request body size is 262144 bytes., content: { application/json: { schema: { $ref: '#/components/schemas/RecipeWrite' } } } }
      responses:
        '200': { description: Updated recipe, content: { application/json: { schema: { $ref: '#/components/schemas/Recipe' } } } }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
    delete:
      operationId: DeletePublisherRecipe
      summary: Permanently delete a recipe when its version matches
      security: [{ publisherAuth: [] }]
      parameters: [ { $ref: '#/components/parameters/id' }, { $ref: '#/components/parameters/domainId' }, { $ref: '#/components/parameters/ifMatch' } ]
      responses:
        '204': { description: Recipe deleted }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
  /api/publish/recipes/categories:
    get:
      operationId: ListPublisherRecipeCategories
      summary: List all categories in the active domain
      security: [{ publisherAuth: [] }]
      parameters: [ { $ref: '#/components/parameters/domainId' } ]
      responses:
        '200': { description: Category inventory, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/RecipeCategory' } } } } }
    post:
      operationId: CreatePublisherRecipeCategory
      summary: Create a category in the active domain
      security: [{ publisherAuth: [] }]
      parameters: [ { $ref: '#/components/parameters/domainId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RecipeCategoryWrite' } } } }
      responses:
        '201': { description: Created category, content: { application/json: { schema: { $ref: '#/components/schemas/RecipeCategory' } } } }
        '400': { $ref: '#/components/responses/ValidationProblem' }
  /api/publish/recipes/categories/{id}:
    get:
      operationId: GetPublisherRecipeCategory
      summary: Get a category in the active domain
      security: [{ publisherAuth: [] }]
      parameters: [ { $ref: '#/components/parameters/id' }, { $ref: '#/components/parameters/domainId' } ]
      responses:
        '200': { description: Category, content: { application/json: { schema: { $ref: '#/components/schemas/RecipeCategory' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: UpdatePublisherRecipeCategory
      summary: Update a category when its version matches
      security: [{ publisherAuth: [] }]
      parameters: [ { $ref: '#/components/parameters/id' }, { $ref: '#/components/parameters/domainId' }, { $ref: '#/components/parameters/ifMatch' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RecipeCategoryWrite' } } } }
      responses:
        '200': { description: Updated category, content: { application/json: { schema: { $ref: '#/components/schemas/RecipeCategory' } } } }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
    delete:
      operationId: DeletePublisherRecipeCategory
      summary: Delete an unused category when its version matches
      security: [{ publisherAuth: [] }]
      parameters: [ { $ref: '#/components/parameters/id' }, { $ref: '#/components/parameters/domainId' }, { $ref: '#/components/parameters/ifMatch' } ]
      responses:
        '204': { description: Category deleted }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/CategoryInUse' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
components:
  securitySchemes:
    publisherAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Requires the existing Publisher or Admin role.
  parameters:
    id: { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    domainId: { name: domainId, in: query, required: true, schema: { type: integer, minimum: 1 } }
    page: { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
    pageSize: { name: pageSize, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
    ifMatch: { name: If-Match, in: header, required: true, schema: { type: string, pattern: '^"[1-9][0-9]*"$' } }
  responses:
    Unauthorized: { description: Authentication required }
    Forbidden: { description: Publisher or Admin role required }
    NotFound: { description: Record does not exist in the requested domain }
    ValidationProblem: { description: Request is invalid or references a category outside the active domain }
    PreconditionFailed: { description: The record has changed since it was read; reload before retrying }
    CategoryInUse: { description: The category cannot be deleted while recipes reference it, including a concurrent assignment that wins the delete race }
  schemas:
    PagedRecipes:
      type: object
      required: [items, page, pageSize, totalCount]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Recipe' } }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        totalCount: { type: integer, minimum: 0 }
    MaintenanceDomain:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, minimum: 1 }
        name: { type: string, maxLength: 200 }
    Recipe:
      allOf: [ { $ref: '#/components/schemas/RecipeWrite' }, { type: object, required: [id, domainId, version], properties: { id: { type: integer }, domainId: { type: integer }, version: { type: integer, minimum: 1 }, updatedDate: { type: string, format: date-time } } } ]
    RecipeWrite:
      type: object
      required: [name, authorName, ingredients, instructions, servings, recipeCategoryId, isApproved]
      properties:
        name: { type: string, maxLength: 150 }
        description: { type: string, maxLength: 500 }
        authorName: { type: string, maxLength: 50 }
        ingredients: { type: string, maxLength: 65536 }
        instructions: { type: string, maxLength: 65536 }
        servings: { type: integer, minimum: 0 }
        recipeCategoryId: { type: integer, minimum: 1 }
        isApproved: { type: boolean }
    RecipeCategory:
      allOf: [ { $ref: '#/components/schemas/RecipeCategoryWrite' }, { type: object, required: [id, domainId, version], properties: { id: { type: integer }, domainId: { type: integer }, version: { type: integer, minimum: 1 } } } ]
    RecipeCategoryWrite:
      type: object
      required: [name, displayOrder, isActive]
      properties:
        name: { type: string, maxLength: 70 }
        description: { type: string, maxLength: 1500 }
        displayOrder: { type: integer }
        isActive: { type: boolean }
