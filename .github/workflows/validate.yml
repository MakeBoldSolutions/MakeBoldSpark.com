name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/MakeBoldSpark.Web/package-lock.json

      - name: Install web dependencies
        working-directory: src/MakeBoldSpark.Web
        run: npm ci

      - name: Lint Markdown
        working-directory: src/MakeBoldSpark.Web
        run: npm run lint:markdown

      - name: Test static content pipeline
        working-directory: src/MakeBoldSpark.Web
        run: npm test

      - name: Restore .NET dependencies
        run: dotnet restore MakeBoldSpark.slnx

      - name: Test .NET solution
        env:
          Jwt__SigningKey: ci-test-signing-key-not-for-production-0123456789
        run: dotnet test MakeBoldSpark.slnx --no-restore

      - name: Verify npm audit threshold
        working-directory: src/MakeBoldSpark.Web
        run: npm audit --audit-level=high
